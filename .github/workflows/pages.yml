name: Publicar en GitHub Pages

# Cada push a main: se corren los tests y el typecheck, se compila el catálogo y se publica la app.
# Si algo falla, no se publica nada y queda la versión anterior.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llega otra, se descarta la que estaba en cola.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    name: Tests, typecheck y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # El build compila contenido/ y copia el catálogo a public/ antes de empaquetar.
      - name: Build de la app
        run: npm run build --workspace @preparados/app
        env:
          VITE_BASE: /preparados.app/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/dist

  publicar:
    name: Publicar
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
